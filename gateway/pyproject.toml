[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symbios-voice-gateway"
version = "0.1.0"
description = "Authenticated Xiaozhi-compatible gateway for Symbios Terminal"
requires-python = ">=3.11"
dependencies = [
    "audioop-lts>=0.2.2,<1; python_version >= '3.13'",
    "fastapi>=0.116,<1",
    "google-cloud-firestore>=2.21,<3",
    "opuslib-next>=1.3,<2",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=14,<16",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["symbios_gateway*"]
