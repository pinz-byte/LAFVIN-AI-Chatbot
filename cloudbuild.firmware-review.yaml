steps:
  - name: espressif/idf:v5.5.2
    entrypoint: bash
    args:
      - -ceu
      - |
        . /opt/esp/idf/export.sh
        diagnostic_args=()
        if [[ "${_LAFVIN_AUDIO_DIAGNOSTIC}" == "true" ]]; then
          diagnostic_args+=(--lafvin-audio-diagnostic)
        fi
        python3 tools/configure_symbios_firmware.py \
          --gateway-url "${_GATEWAY_URL}" \
          "${diagnostic_args[@]}"
        cd xiaozhi-esp32-main
        python3 scripts/release.py lafvin-aichatbot \
          -c config.symbios.local.json \
          --name lafvin-aichatbot-symbios-terminal
        sha256sum \
          build/merged-binary.bin \
          releases/v2.2.4_lafvin-aichatbot-symbios-terminal.zip \
          > firmware-review-sha256.txt

artifacts:
  objects:
    location: gs://${_ARTIFACT_BUCKET}/symbios-terminal/${BUILD_ID}/
    paths:
      - xiaozhi-esp32-main/build/merged-binary.bin
      - xiaozhi-esp32-main/build/flasher_args.json
      - xiaozhi-esp32-main/firmware-review-sha256.txt
      - xiaozhi-esp32-main/releases/v2.2.4_lafvin-aichatbot-symbios-terminal.zip

options:
  machineType: E2_HIGHCPU_8

timeout: 1800s

substitutions:
  _LAFVIN_AUDIO_DIAGNOSTIC: "false"
