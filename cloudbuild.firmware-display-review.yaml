steps:
  - name: espressif/idf:v5.5.2
    entrypoint: bash
    args:
      - -ceu
      - |
        . /opt/esp/idf/export.sh
        python3 tools/configure_symbios_firmware.py \
          --gateway-url "${_GATEWAY_URL}" \
          --display-only
        cd xiaozhi-esp32-main
        python3 scripts/release.py lafvin-aichatbot \
          -c config.symbios.local.json \
          --name lafvin-aichatbot-symbios-display-v1
        test -s build/xiaozhi.bin
        sha256sum build/xiaozhi.bin > firmware-display-review-sha256.txt
        grep -q '^CONFIG_SYMBIOS_DISPLAY_ONLY=y$' sdkconfig
        grep -q '^CONFIG_SYMBIOS_TIMEZONE="PET5"$' sdkconfig
        grep -q '^CONFIG_FLASH_NONE_ASSETS=y$' sdkconfig
        grep -q '^# CONFIG_USE_AUDIO_PROCESSOR is not set$' sdkconfig
        grep -q '^# CONFIG_USE_CUSTOM_WAKE_WORD is not set$' sdkconfig

artifacts:
  objects:
    location: gs://${_ARTIFACT_BUCKET}/symbios-display-review/${BUILD_ID}/
    paths:
      - xiaozhi-esp32-main/build/xiaozhi.bin
      - xiaozhi-esp32-main/build/xiaozhi.map
      - xiaozhi-esp32-main/build/flasher_args.json
      - xiaozhi-esp32-main/sdkconfig
      - xiaozhi-esp32-main/firmware-display-review-sha256.txt

options:
  machineType: E2_HIGHCPU_8

timeout: 1800s
