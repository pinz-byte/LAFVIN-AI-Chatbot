name: Validate Symbios Terminal

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Public Symbios gateway bootstrap URL for a review image
        required: false
        type: string
      lafvin_audio_diagnostic:
        description: Enable local-only LAFVIN microphone diagnostics
        required: false
        default: false
        type: boolean
      lafvin_slot_audition:
        description: Enable RAM-only LAFVIN ES7210 slot audition
        required: false
        default: false
        type: boolean
      display_only:
        description: Build the authenticated portfolio display with cloud voice disabled
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/feat/symbios-voice-gateway

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - run: pip install -e '.[test]'
      - run: pytest

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        variant:
          - lafvin-aichatbot
          - lafvin-aichatbot-symbios-terminal
    defaults:
      run:
        working-directory: xiaozhi-esp32-main
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.variant }} without flashing
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python3 scripts/release.py lafvin-aichatbot --name "${{ matrix.variant }}"
      - name: Upload compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-compile-only
          path: xiaozhi-esp32-main/releases/*.zip
          if-no-files-found: error

  firmware-review:
    if: github.event_name == 'workflow_dispatch' && inputs.gateway_url != ''
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    defaults:
      run:
        working-directory: xiaozhi-esp32-main
    steps:
      - uses: actions/checkout@v4
      - name: Build endpoint-injected review image without flashing
        shell: bash
        env:
          GATEWAY_URL: ${{ inputs.gateway_url }}
          LAFVIN_AUDIO_DIAGNOSTIC: ${{ inputs.lafvin_audio_diagnostic }}
          LAFVIN_SLOT_AUDITION: ${{ inputs.lafvin_slot_audition }}
          DISPLAY_ONLY: ${{ inputs.display_only }}
        run: |
          . /opt/esp/idf/export.sh
          diagnostic_args=()
          if [[ "$LAFVIN_AUDIO_DIAGNOSTIC" == "true" ]]; then
            diagnostic_args+=(--lafvin-audio-diagnostic)
          fi
          if [[ "$LAFVIN_SLOT_AUDITION" == "true" ]]; then
            diagnostic_args+=(--lafvin-slot-audition)
          fi
          if [[ "$DISPLAY_ONLY" == "true" ]]; then
            diagnostic_args+=(--display-only)
          fi
          python3 ../tools/configure_symbios_firmware.py \
            --gateway-url "$GATEWAY_URL" \
            "${diagnostic_args[@]}"
          python3 scripts/release.py lafvin-aichatbot \
            -c config.symbios.local.json \
            --name lafvin-aichatbot-symbios-display-v1
          sha256sum \
            build/merged-binary.bin \
            releases/v2.2.4_lafvin-aichatbot-symbios-display-v1.zip \
            > firmware-review-sha256.txt
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lafvin-aichatbot-symbios-diagnostic-review
          path: |
            xiaozhi-esp32-main/build/merged-binary.bin
            xiaozhi-esp32-main/build/flasher_args.json
            xiaozhi-esp32-main/firmware-review-sha256.txt
            xiaozhi-esp32-main/releases/v2.2.4_lafvin-aichatbot-symbios-display-v1.zip
          if-no-files-found: error
